name: Terraform CI/CD

on:
    workflow_dispatch:
        inputs:
            image_tag:
                description: 'Image tag to deploy'
                required: false
                type: string
    pull_request:
        branches: ["main"]
        paths: ["terraform/**", "app/**"]
    push:
        branches: ["main"]
        paths: ["terraform/**", "app/**"]


permissions:
    contents: read
    pull-requests: write
    id-token: write


env:
    ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    ARM_USE_OIDC: true
    IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

jobs:
    plan:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: "1.9.0"

            - name: Terraform Init
              run: |
                terraform init \
                   -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT_NAME }}" \
                   -backend-config="resource_group_name=rg-tfstate" \
                   -backend-config="container_name=tf-state" \
                   -backend-config="key=cicd-demo.dev.tfstate" 

            - name: Terraform Plan
              id: plan
              run: terraform plan -no-color -input=false -var="image_tag=${{ env.IMAGE_TAG }}"
              continue-on-error: true

            - name: Comment plan on PR
              uses: actions/github-script@v7
              with:
                script: |
                  const output = `#### Terraform Plan Output
                  \`\`\`
                  ${{steps.plan.outputs.stdout}}
                  \`\`\``;
                  github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: output
                  });

            - name: Fail job if plan failed
              if: steps.plan.outcome == 'failure'
              run: exit 1
    apply:
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: "1.9.0"

            - name: Terraform Init
              run: |
                terraform init \
                   -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT_NAME }}" \
                   -backend-config="resource_group_name=rg-tfstate" \
                   -backend-config="container_name=tf-state" \
                   -backend-config="key=cicd-demo.dev.tfstate" 

            - name: Terraform Apply
              run: terraform apply -auto-approve -no-color -input=false -var="image_tag=${{ env.IMAGE_TAG }}"

            - name: Get App Service name
              id: app_output
              run: echo "app_name=$(terraform output -raw app_service_name)" >> $GITHUB_OUTPUT
              
        outputs:
            app_service_name: ${{ steps.app_output.outputs.app_name }}


    build_and_push:
        needs: apply
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Log in to Azure Container Registry
              uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Get Terraform outputs
              id: tf_outputs
              working-directory: terraform
              run: |
                echo "app_service_name=$(terraform output -raw app_service_name)" >> "$GITHUB_OUTPUT"
                echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
                echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"

            - name: Log in to ACR
              run: az acr login --name ${{ steps.tf_outputs.outputs.acr_name }}


            - name: Build and push image
              working-directory: app
              run: |
                docker build -t ${{ steps.tf_outputs.outputs.acr_login_server }}/cicd-demo-app:${{ env.IMAGE_TAG }} 
                docker push ${{ steps.tf_outputs.outputs.acr_login_server }}/cicd-demo-app:${{ env.IMAGE_TAG }}


            - name: Restart App Service to pull new image
              run: |
                az webapp restart \
                   --name ${{ steps.tf_outputs.outputs.app_service_name }} \
                    --resource-group rg-${{ vars.PROJECT_NAME }} 